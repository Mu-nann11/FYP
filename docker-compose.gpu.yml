services:
  fiji-stitcher:
    build: .
    container_name: fiji-stitcher-gpu
    working_dir: /app

    environment:
      FIJI_PATH: /opt/Fiji.app
      FIJI_EXE: /opt/Fiji.app/ImageJ-linux64
      NVIDIA_VISIBLE_DEVICES: all

    volumes:
      - ./data:/data
      - ./results:/results
      - ./fiji_config.json:/app/fiji_config.json

    command: micromamba run -n fiji-stitcher python batch_run_all_to_one.py --gpu

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
